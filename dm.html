window.copyTxt = function(num, mode) {
  const s = SETS.find(x => x.num === num);
  const text = mode === 'dm' ? s.dm_text : s.caption_text;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');

      ? `✅ [코디${num} DM 링크 세트] 복사 완료! DM에 붙여넣으세요!`

    setTimeout(() => t.style.display = 'none', 2500);
  });
};
